```yaml
name: Test and Deploy

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run tests
        env:
          SECRET_KEY: test-secret-key
          DB_PATH: ":memory:"
        run: pytest tests/ -v

  deploy:
    name: Deploy to server
    needs: test
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -eu

          echo "Checking deployment settings"
          if [ -z "$DEPLOY_HOST" ]; then
            echo "ERROR: DEPLOY_HOST secret is empty or missing"
            exit 1
          fi
          if [ -z "$DEPLOY_USER" ]; then
            echo "ERROR: DEPLOY_USER secret is empty or missing"
            exit 1
          fi
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "ERROR: DEPLOY_SSH_KEY secret is empty or missing"
            exit 1
          fi

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          echo "Checking SSH key format"
          if ! ssh-keygen -y -f "$HOME/.ssh/deploy_key" > /dev/null; then
            echo "ERROR: SSH private key is invalid or has an unsupported format"
            exit 1
          fi

          echo "Checking server connection"
          if ! ssh-keyscan -T 10 -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"; then
            echo "ERROR: Cannot reach SSH server at DEPLOY_HOST"
            exit 1
          fi

          echo "Connecting to deployment server"
          ssh -v \
            -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo /var/www/planner-app/deploy.sh'
```
