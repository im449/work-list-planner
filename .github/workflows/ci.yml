name: Test and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run tests
        env:
          SECRET_KEY: test-secret-key
          DB_PATH: ":memory:"
        run: pytest tests/ -v

  deploy:
    needs: test
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -eu

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          echo "=== 1. Проверяем приватный ключ ==="
          if ! ssh-keygen -y -P "" -f "$HOME/.ssh/deploy_key" > /dev/null; then
            echo "ОШИБКА: приватный ключ не читается или защищён паролем."
            exit 1
          fi

          echo "=== 2. Проверяем доступность сервера ==="
          if ! ssh-keyscan -T 10 -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts" 2>&1; then
            echo "ОШИБКА: сервер недоступен по SSH."
            exit 1
          fi

          echo "=== 3. Подключаемся и запускаем деплой ==="
          ssh -vv \
            -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'echo "SSH_OK"; sudo -n /var/www/planner-app/deploy.sh'

          echo "=== Деплой завершён ==="
