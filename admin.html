<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Админка — Work List</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 22px; }
  .login { max-width: 320px; display: flex; flex-direction: column; gap: 10px; }
  input, button { padding: 8px; font-size: 15px; }
  button { cursor: pointer; }
  table { border-collapse: collapse; width: 100%; margin-top: 16px; }
  th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
  th { background: #f5f5f5; }
  .err { color: #b00; }
  .actions button { margin-right: 6px; }
  .role-badge { padding: 2px 8px; border-radius: 10px; font-size: 13px; }
  .admin { background: #ffe9b3; }
  .user { background: #e3eefc; }
</style>
</head>
<body>
<h1>Панель администратора</h1>
<div id="loginBox" class="login">
  <input id="username" placeholder="Логин" autocomplete="username">
  <input id="password" type="password" placeholder="Пароль" autocomplete="current-password">
  <button onclick="login()">Войти</button>
  <div id="loginErr" class="err"></div>
</div>
<div id="panel" style="display:none">
  <p>Вы вошли как <b id="me"></b>. <button onclick="logout()">Выйти</button></p>
  <section style="margin:18px 0;padding:14px;border:1px solid #ddd;border-radius:8px;background:#fafafa">
    <h2 style="font-size:18px;margin-bottom:8px">Регистрация новых пользователей</h2>
    <p id="registrationState" style="margin-bottom:10px">Проверяем настройку...</p>
    <button id="registrationButton" onclick="toggleRegistration()" disabled>Загрузка...</button>
    <span id="registrationError" class="err" style="margin-left:10px"></span>
  </section>
  <table id="usersTable">
  <table id="usersTable">
    <thead><tr><th>ID</th><th>Логин</th><th>Роль</th><th>Задач</th><th>Статус</th><th>Создан</th><th>Действия</th></tr></thead>
    <tbody></tbody>
  </table>
  <div id="panelErr" class="err"></div>
</div>
<script>
const API = '';
const tokenKey = 'adminToken';
function getToken(){ return localStorage.getItem(tokenKey); }

async function login(){
  const r = await fetch(API + '/token', {
    method: 'POST',
    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
    body: new URLSearchParams({username: username.value, password: password.value})
  });
  if (!r.ok){ loginErr.textContent = 'Неверный логин или пароль'; return; }
  const d = await r.json();
  localStorage.setItem(tokenKey, d.access_token);
  username.value = password.value = loginErr.textContent = '';
  load();
}

function logout(){ localStorage.removeItem(tokenKey); location.reload(); }

async function loadRegistrationSetting(){
  const state = document.getElementById('registrationState');
  const button = document.getElementById('registrationButton');
  const error = document.getElementById('registrationError');
  try {
    const response = await fetch(API + '/admin/settings/registrations', {
      headers: {'Authorization': 'Bearer ' + getToken()}
    });
    if (!response.ok) throw new Error('Не удалось прочитать настройку (' + response.status + ')');

    const data = await response.json();
    state.textContent = data.enabled
      ? 'Сейчас регистрация ВКЛЮЧЕНА'
      : 'Сейчас регистрация ОТКЛЮЧЕНА';
    state.style.color = data.enabled ? '#218838' : '#b00';
    button.textContent = data.enabled ? 'Отключить регистрацию' : 'Включить регистрацию';
    button.disabled = false;
    button.dataset.enabled = String(data.enabled);
    error.textContent = '';
  } catch (e) {
    state.textContent = 'Не удалось получить состояние регистрации';
    error.textContent = e.message;
    button.disabled = true;
  }
}

async function toggleRegistration(){
  const button = document.getElementById('registrationButton');
  const current = button.dataset.enabled === 'true';
  const next = !current;
  const action = next ? 'включить' : 'отключить';

  if (!confirm('Вы действительно хотите ' + action + ' регистрацию новых пользователей?')) return;

  button.disabled = true;
  document.getElementById('registrationError').textContent = '';

  try {
    const response = await fetch(API + '/admin/settings/registrations', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + getToken(),
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({enabled: next})
    });

    const data = await response.json();
    if (!response.ok) throw new Error(data.detail || 'Ошибка сохранения настройки');

    await loadRegistrationSetting();
  } catch (e) {
    document.getElementById('registrationError').textContent = e.message;
    button.disabled = false;
  }
}

async function load(){
  const t = getToken();
  if (!t) return;
  const r = await fetch(API + '/admin/users', {headers: {'Authorization': 'Bearer ' + t}});
  if (r.status === 401){ localStorage.removeItem(tokenKey); return; }
  if (r.status === 403){ panelErr.textContent = 'Этот аккаунт не администратор'; return; }
  const meResponse = await fetch(API + '/users/me', {
    headers: {'Authorization': 'Bearer ' + t}
  });
  if (meResponse.ok) {
    const currentUser = await meResponse.json();
    document.getElementById('me').textContent = currentUser.username || '';
  }
  loginBox.style.display = 'none';
  panel.style.display = 'block';
  await loadRegistrationSetting();
  const users = await r.json();
  const tbody = document.querySelector('#usersTable tbody');
  tbody.innerHTML = '';
  for (const u of users){
    const tr = document.createElement('tr');
    const isAdmin = u.role === 'admin';
    tr.innerHTML = `<td>${u.id}</td><td>${u.username}</td>
      <td><span class="role-badge ${u.role}">${isAdmin ? 'админ' : 'пользователь'}</span></td>
      <td>${u.task_count}</td>
      <td>${u.is_active ? 'Активен' : 'Заблокирован'}</td>
      <td>${u.created_at || ''}</td>
      <td class="actions"></td>`;
    const cell = tr.querySelector('.actions');
    const toggle = document.createElement('button');
    toggle.textContent = isAdmin ? 'Снять админа' : 'Сделать админом';
    toggle.onclick = () => setRole(u.id, isAdmin ? 'user' : 'admin');
    cell.appendChild(toggle);

    const activeButton = document.createElement('button');
    activeButton.textContent = u.is_active ? 'Заблокировать' : 'Разблокировать';
    activeButton.onclick = () => {
      const action = u.is_active ? 'заблокировать' : 'разблокировать';
      if (confirm('Вы действительно хотите ' + action + ' пользователя ' + u.username + '?')) {
        setActive(u.id, !u.is_active);
      }
    };
    cell.appendChild(activeButton);

    const del = document.createElement('button');
    del.textContent = 'Удалить';
    del.onclick = () => { if (confirm('Удалить пользователя ' + u.username + ' и все его задачи?')) deleteUser(u.id); };
    cell.appendChild(del);
    tbody.appendChild(tr);
  }
}

async function setRole(id, role){
  const r = await fetch(API + `/admin/users/${id}/role`, {
    method: 'POST',
    headers: {'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json'},
    body: JSON.stringify({role})
  });
  if (!r.ok) panelErr.textContent = (await r.json()).detail || 'Ошибка';
  load();
}

async function setActive(id, active){
  const r = await fetch(API + `/admin/users/${id}/active`, {
    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + getToken(),
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({is_active: active})
  });

  if (!r.ok) {
    const d = await r.json();
    panelErr.textContent = d.detail || 'Ошибка изменения статуса';
  } else {
    panelErr.textContent = '';
  }
  await load();
}

async function deleteUser(id){
  const r = await fetch(API + `/admin/users/${id}`, {
    method: 'DELETE',
    headers: {'Authorization': 'Bearer ' + getToken()}
  });
  if (!r.ok) panelErr.textContent = (await r.json()).detail || 'Ошибка';
  load();
}

load();
</script>
</body>
</html>
